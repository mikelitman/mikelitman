name: Weekly links digest

on:
  schedule:
    - cron: '7 17 * * 0'   # Sundays 17:07 UTC (6pm UK summer time, 5pm winter)
  workflow_dispatch:        # allow manual runs

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slack-links
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      # Logs only show counts, never links (this repo is public).
      - name: Send this week's digest
        run: node weekly.mjs
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ABOUT_ME: ${{ secrets.ABOUT_ME }}
          SLACK_QUERY: ${{ secrets.SLACK_QUERY }}
